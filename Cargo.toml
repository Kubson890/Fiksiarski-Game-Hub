[package]
name = "Fiksiarski_game_hub"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
rand = "0.8"
shakmaty = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rodio = { version = "0.19", default-features = false }
ureq = { version = "2.10", features = ["json"] }
sha2 = "0.10"
tungstenite = "0.24"